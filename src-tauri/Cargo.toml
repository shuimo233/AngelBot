[package]
name = "angelbot"
version = "0.1.0"
description = "AngelBot - 个人 AI Agent 桌面应用"
authors = ["AngelBot contributors"]
repository = "https://github.com/shuimo233/AngelBot"
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-wdio = { version = "1.3.0", optional = true }
tauri-plugin-wdio-webdriver = { version = "1.3.0", optional = true }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-keyring-store = "0.2"
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "chrono", "uuid"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "5"
thiserror = "1"
tempfile = "3"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls", "system-proxy"], default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
dotenvy = "0.15"
tiny_http = "0.12"
bincode = "1.3"
async-trait = "0.1"
auto-launch = "0.5"
notify = { version = "6", features = ["macos_fsevent"] }
sha2 = "0.10"
hex = "0.4"
sqlite-vec = "0.1"
wait-timeout = "0.2"
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"
png = "0.17.16"
rand = "0.8"
jsonwebtoken = { version = "9.3", default-features = false }
oauth2 = { version = "5", default-features = false }
fs2 = "0.4"
subtle = "2.6"

[target.'cfg(windows)'.dependencies]
windows-capture = "=2.0.1"
image = { version = "=0.25.8", default-features = false }
# Delegated-network scope keys must distinguish a replacement directory at the
# same path. `FileIdInfo` provides the filesystem's stable directory identity;
# timestamps are user-mutable and therefore are not a security boundary.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_StationsAndDesktops", "Win32_System_RemoteDesktop", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm", "Win32_System_ProcessStatus", "Win32_UI_Accessibility", "Win32_System_Com"] }

[features]
desktop-e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]
production-updater = ["dep:tauri-plugin-updater"]

[profile.dev]
incremental = false
